<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNICORN funnel review</title><style>body{margin:0;background:#26202e;color:white;font:14px system-ui}header{position:sticky;top:0;background:#32263d;padding:12px;display:flex;gap:15px;z-index:2}button,select{padding:10px;font:inherit}iframe{display:block;margin:20px auto;border:1px solid #685476;height:844px;background:#0c0a10}pre{white-space:pre-wrap;padding:16px;max-width:1100px;margin:auto}</style><header><button id="test">Run full funnel checks</button><label>Viewport <select id="width"><option>320</option><option>360</option><option selected>390</option><option>412</option><option>768</option><option>1024</option><option>1440</option></select></label><button id="reset">Reset</button><button id="inspect">Inspect 320 overflow</button><b id="status">Ready</b></header><iframe title="UNICORN viewport preview" id="preview" width="390" src="/?utm_source=instagram&utm_medium=paid_social&utm_campaign=qa-browser&utm_content=mobile-test"></iframe><pre id="results"></pre><script>
const frame=document.querySelector('iframe'), results=document.querySelector('#results'), status=document.querySelector('#status'), widths=[320,360,390,412,768,1024,1440];
document.querySelector('#width').onchange=e=>{frame.width=e.target.value;frame.contentWindow.scrollTo(0,0)};document.querySelector('#reset').onclick=()=>frame.contentWindow.location.reload();
const wait=ms=>new Promise(r=>setTimeout(r,ms));let checks=[];function check(name,ok,detail=''){checks.push({name,ok,detail});results.textContent=JSON.stringify(checks,null,2);if(!ok)console.error(name,detail)}
document.querySelector('#inspect').onclick=async()=>{frame.width=320;await wait(200);const d=frame.contentDocument,w=frame.contentWindow;status.textContent=JSON.stringify([...d.querySelectorAll('body *')].filter(e=>{let p=e.parentElement;while(p&&p!==d.body){if(['hidden','clip','auto','scroll'].includes(w.getComputedStyle(p).overflowX))return false;p=p.parentElement}return e.getBoundingClientRect().right>d.documentElement.clientWidth+1}).map(e=>({tag:e.tagName,c:e.className,r:Math.round(e.getBoundingClientRect().right)})).slice(0,30))};document.querySelector('#test').onclick=async()=>{checks=[];status.textContent='Testing';try{const w=frame.contentWindow,d=frame.contentDocument;await d.fonts.ready;
for(const width of widths){frame.width=width;await wait(250);const root=d.documentElement;check('No horizontal overflow at '+width,root.scrollWidth<=root.clientWidth+1,JSON.stringify({widths:[root.scrollWidth,root.clientWidth],elements:[...d.querySelectorAll('main section, .context-inner, .launch-signup, .site-header, .footer, .startup-card, .company, .rules-details, .exposure-rule, .why-inner, .sticky-launch')].filter(e=>e.getBoundingClientRect().right>root.clientWidth+1).map(e=>e.className)}));const input=d.querySelector('input[type=email]');check('Email text >=16px at '+width,parseFloat(w.getComputedStyle(input).fontSize)>=16);check('Hero CTA fits at '+width,d.querySelector('.hero form button').getBoundingClientRect().right<=root.clientWidth);}
frame.width=390;await wait(200);check('Five signup locations',d.querySelectorAll('[data-launch-signup]').length===5);check('Lazy video',d.querySelector('video').preload==='none');check('Video not downloaded before play',!w.performance.getEntriesByType('resource').some(e=>e.name.endsWith('.mp4')));
const hero=d.querySelector('[data-launch-signup=hero]'),form=hero.querySelector('form'),input=hero.querySelector('input[type=email]');input.value='not-an-email';check('Browser rejects malformed email',!input.checkValidity());input.value='browser-'+Date.now()+'@example.com';const originalFetch=w.fetch;w.fetch=(url,...args)=>url==='/api/launch'?Promise.reject(new TypeError('Failed to fetch')):originalFetch.call(w,url,...args);form.requestSubmit();await wait(350);check('Network failure shows retry state',!!hero.querySelector('[role=alert]'));check('Network failure retains email',input.value.includes('browser-'));check('Kickstarter remains available after failure',!!hero.querySelector('a[href*="kickstarter.com"]'));w.fetch=originalFetch;form.requestSubmit();await wait(1300);check('Real local signup succeeds inline',!!hero.querySelector('.launch-success'));const success=hero.querySelector('.success-cta');if(success){success.addEventListener('click',e=>e.preventDefault(),{once:true});success.click();check('Kickstarter retains ad UTMs',success.href.includes('utm_source=instagram')&&success.href.includes('utm_content=mobile-test'));}
const second=d.querySelector('[data-launch-signup="how-to-play"]');second.querySelector('input[type=email]').value=input.value.toUpperCase();second.querySelector('form').requestSubmit();await wait(1000);check('Duplicate succeeds inline',!!second.querySelector('.launch-success'));
d.querySelector('#cards .card-grid').scrollIntoView();await wait(500);check('Sticky visible beyond hero',d.querySelector('.sticky-launch').classList.contains('is-visible'));d.querySelector('.sticky-launch button').click();await wait(700);check('Sticky focuses signup',d.activeElement.type==='email');check('Sticky hides when editing',!d.querySelector('.sticky-launch').classList.contains('is-visible'));
d.querySelector('.scenario-tabs button').click();await wait(100);d.querySelector('.demo-controls .coral-button').click();await wait(100);check('Interactive Poach demo still runs',d.querySelector('.demo-narration').textContent.includes('POACH')&&d.querySelector('.company-value').textContent.includes('850'));
d.querySelector('#real-players').scrollIntoView();await wait(500);const video=d.querySelector('video');video.muted=true;await video.play();await wait(400);check('Trailer plays',!video.paused&&video.videoWidth>0);video.pause();check('Playtest photos decode',Array.from(d.querySelectorAll('.proof-photos img')).every(im=>im.naturalWidth>0));w.scrollTo(0,d.documentElement.scrollHeight);await wait(350);w.scrollTo(0,0);status.textContent=checks.every(c=>c.ok)?'PASS: '+checks.length+' checks':'FAIL: '+JSON.stringify(checks.filter(c=>!c.ok));}
catch(e){status.textContent='Test error: '+e.message;check('Harness completed',false,e.stack)}};
</script></html>
